[project]
name = "llm-math-education"
version = "0.6.0"
description = "Retrieval-backed LLMs for math education"
authors = [{ name = "Zachary Levonian", email = "zach@digitalharbor.org" }]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=1.0.0",
    "openai>=1.0",
    "streamlit>=1.0.0",
    "pandas>=2.0",
    "tiktoken>=0.5",
    "scipy>=1.11.0",
    "argon2-cffi>=21.3.0",
]

[project.optional-dependencies]
openstax = [
    "beautifulsoup4>=4.12.2",
    "requests>=2.31",
]

[project.urls]
Repository = "https://github.com/DigitalHarborFoundation/llm-math-education"

[dependency-groups]
dev = [
    "beautifulsoup4>=4.12.2",
    "jupyterlab>=4.0.2",
    "matplotlib>=3.7.1",
    "pre-commit>=3.0",
    "pytest>=8.0",
    "pytest-cov>=4.0.0",
    "pytest-dotenv>=0.5.2",
    "requests>=2.31",
]

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.black]
line-length = 120
include = '\.pyi?$'
exclude = '''
/(
      .eggs         # exclude a few common directories in the
    | .git          # root of the project
    | .github
    | .gitignore
    | .hg
    | .mypy_cache
    | .tox
    | .venv
    | venv
    | _build
    | buck-out
    | build
    | ci
    | data
    | dist
    | docs
    | docsrc
  )/
'''

[tool.isort]
profile = "black"
line_length = 79
multi_line_output = 3
include_trailing_comma = true
virtual_env = "venv"
